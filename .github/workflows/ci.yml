name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify lockfiles are committed
        run: |
          test -f pnpm-lock.yaml
          test -n "$(find dotnet -name packages.lock.json -print -quit)"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - name: TS tests (node mode)
        # Native-font suites have their own Vitest workers; avoid multiplying them
        # across workspaces on a small runner. Workloads and test deadlines stay unchanged.
        run: pnpm test --concurrency=1

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: TS tests (browser mode)
        run: pnpm test:browser --concurrency=1

      - name: .NET restore (locked)
        run: dotnet restore dotnet/OFDCompose.slnx --locked-mode

      - name: Regenerate real Worker OFD fixtures
        run: |
          node packages/render-worker/tests/generate-ofd-fixtures.mjs
          node packages/render-worker/tests/generate-ofd-geometry.mjs
          node packages/render-worker/tests/generate-pdf-whitespace-probe.mjs
          test -z "$(git status --porcelain -- tests/ofd-writer/fixtures tests/pdf-writer/fixtures/whitespace-reader/worker-double)"

      - name: .NET tests
        env:
          OFD_WRITER_OUTPUT: ${{ runner.temp }}/ofd-reader-input
        run: dotnet test dotnet/OFDCompose.slnx --no-restore

      - name: Independent PDF readers and mutation gates
        run: |
          node tests/pdf-writer/reader-gate.mjs
          docker build -t ofd-compose-qpdf tests/pdf-writer
          PDF_READER_IMAGE=ofd-compose-qpdf python3 tests/pdf-writer/mutation-gate.py
          docker run --rm --network none --memory 256m --cpus 2 \
            -v "$PWD/.scratch/issue16-output:/pdf:ro" --entrypoint sh ofd-compose-qpdf \
            -c 'for f in /pdf/*.pdf /pdf/rtl/*.pdf /pdf/rtl/reference/*.pdf /pdf/spacing/*.pdf; do qpdf --check "$f" || exit; done'

      - name: Form grouping preserves baseline pixels
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          baseline_dir="$(mktemp -d "${RUNNER_TEMP}/pdf-before-forms.XXXXXX")"
          git fetch --no-tags --depth=1 origin 7ecf477571045ad5dc9418c9141efc593f5e55b9
          git archive 7ecf477571045ad5dc9418c9141efc593f5e55b9 | tar -x -C "$baseline_dir"
          export DOTNET_CLI_HOME="${RUNNER_TEMP}/pdf-baseline-cli"
          dotnet restore "$baseline_dir/dotnet/tests/OFDCompose.PdfIrWriter.Tests/OFDCompose.PdfIrWriter.Tests.csproj" --locked-mode -m:1 /nodeReuse:false
          dotnet build "$baseline_dir/dotnet/tests/OFDCompose.PdfIrWriter.Tests/OFDCompose.PdfIrWriter.Tests.csproj" --no-restore -m:1 /nodeReuse:false /p:UseSharedCompilation=false --disable-build-servers
          dotnet "$baseline_dir/dotnet/tests/OFDCompose.PdfIrWriter.Tests/bin/Debug/net10.0/OFDCompose.PdfIrWriter.Tests.dll"
          python3 tests/pdf-writer/compare-renderings.py "$baseline_dir/.scratch/issue16-output" "$PWD/.scratch/issue16-output" --image ofd-compose-qpdf --report "${RUNNER_TEMP}/pdf-form-pixels.json"
          python3 tests/pdf-writer/compare-renderings.py "$PWD/.scratch/issue16-output/rtl/reference" "$PWD/.scratch/issue16-output/rtl" --image ofd-compose-qpdf --baseline-label "IR visual glyph emission order" --max-channel-delta 1 --pixel-allowlist tests/pdf-writer/rtl-raster-tolerance.json --report "${RUNNER_TEMP}/pdf-rtl-pixels.json"
          python3 tests/pdf-writer/compare-renderings.py tests/pdf-writer/fixtures/spacing-reference "$PWD/.scratch/issue16-output/spacing" --image ofd-compose-qpdf --baseline-label "Pre-fix unsemantic spacing paint" --report "${RUNNER_TEMP}/pdf-spacing-pixels.json"

      - name: Independent Java OFD Reader
        run: |
          docker build -t ofd-compose-reader tests/ofd-writer/java
          docker run --rm --network none --memory 512m --cpus 2 \
            -v "$PWD/tests/ofd-writer/fixtures:/fixtures:ro" \
            -v "${{ runner.temp }}/ofd-reader-input:/input:ro" \
            ofd-compose-reader /fixtures /input
          python3 tests/ofd-writer/mutation-gate.py ofd-compose-reader \
            "$PWD/tests/ofd-writer/fixtures" "${{ runner.temp }}/ofd-reader-input"

      - name: Golden corpus scan reports are reproducible
        # git status (not git diff): a new template whose .scan.json was never
        # committed must also fail this gate — git diff ignores untracked files.
        run: |
          pnpm --filter @ofd-compose/golden-corpus run scan
          if [ -n "$(git status --porcelain)" ]; then
            echo "Scan reports are not reproducible or not committed:"
            git status --porcelain
            exit 1
          fi

      - name: License whitelist (pnpm + NuGet)
        run: pnpm check:licenses
